[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "power-unit-programme-control"
version = "1.0.0"
description = "Dependency, capacity, cost and release-readiness control for a fictional motorsport power-unit programme"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Carlos Daniel Marques Freire"}]
dependencies = []

[project.optional-dependencies]
reports = ["reportlab>=4"]
test = ["pytest>=8"]

[project.scripts]
pu-control = "pu_control.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
